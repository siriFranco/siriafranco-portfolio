<section class="home">

  <!-- 👤 HERO / ABOUT (equivalente a job header) -->
  <div class="home__header">

    <div class="home__meta">
      <h1>{{ homeConfig.title }}</h1>
      <h3 class="home__subtitle">
        {{ homeConfig.subtitle }}
      </h3>
    </div>

  </div>

  <br>

  <!-- 🧭 DESCRIPTION (equivalente a job descriptions) -->
  <div class="home__content">

    <p *ngFor="let line of homeConfig.description">
      {{ line }}
    </p>

  </div>

</section>
