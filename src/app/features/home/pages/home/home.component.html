<section class="home">

  <div class="home__header">

    <!-- 🧠 Columna izquierda (contenido principal) -->
    <div class="home__left">

      <div class="home__meta anim-reveal" [class.visible]="contentVisible">
        <h1>{{ homeConfig.title }}</h1>

        <h3 class="home__subtitle">
          {{ homeConfig.subtitle }}
        </h3>

        <p *ngFor="let line of homeConfig.description">
          {{ line }}
        </p>
      </div>

    </div>

    <!-- 👋 Columna derecha (intro + typing) -->
    <div class="home__intro-wrapper">
      <p class="home__intro anim-delayed" [class.visible]="introVisible">
        {{ displayedIntro }}
        <span class="cursor" *ngIf="isTyping"></span>
      </p>
    </div>

  </div>

</section>
